aid: center-for-coastal-and-ocean-mapping

name: Center for Coastal and Ocean Mapping

description: 'Center for Coastal and Ocean Mapping (CCOM) is a research and development organization based at the University of New Hampshire, dedicated to advancing coastal and ocean mapping technologies. It provides high-resolution bathymetric data, geospatial services, and innovative tools for scientists, engineers, and policymakers to better understand and manage marine environments. CCOM collaborates with federal agencies, academic institutions, and industry partners to deliver open data and support sustainable ocean stewardship.'

